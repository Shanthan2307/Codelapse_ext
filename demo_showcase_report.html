E = 'http://localhost:5000/api/tasks';\n\nexport function useTasks() {\n  const [tasks, setTasks] = useState<Task[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState<string | null>(null);\n\n  useEffect(() => {\n    fetchTasks();\n  }, []);\n\n  const fetchTasks = async () => {\n    try {\n      const res = await fetch(API_BASE);\n      const json = await res.json();\n      setTasks(json.data || []);\n    } catch (err: any) {\n      setError('Failed to fetch tasks');\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  const addTask = async (title: string, priority: Priority) => {\n    const res = await fetch(API_BASE, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ title, priority })\n    });\n    const newTask = await res.json();\n    setTasks(prev => [...prev, newTask]);\n  };\n\n  const toggleTask = async (id: string) => {\n    const res = await fetch(`${API_BASE}/${id}/toggle`, { method: 'PATCH' });\n    const updated = await res.json();\n    setTasks(prev => prev.map(t => t.id === id ? updated : t));\n  };\n\n  const deleteTask = async (id: string) => {\n    await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });\n    setTasks(prev => prev.filter(t => t.id !== id));\n  };\n\n  return { tasks, loading, error, addTask, toggleTask, deleteTask };\n}\n","cursorStart":1350,"cursorEnd":1350},{"timestamp":355000,"filePath":"client/src/components/TaskHeader.tsx","content":"import React from 'react';\n\ninterface TaskHeaderProps {\n  totalCount: number;\n  completedCount: number;\n}\n\nexport const TaskHeader: React.FC<TaskHeaderProps> = ({ totalCount, completedCount }) => {\n  const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;\n\n  return (\n    <div className=\"task-header\">\n      <div>\n        <h2>⚡ TaskMaster Pro</h2>\n        <p className=\"subtitle\">Full-Stack Enterprise Task Management</p>\n      </div>\n      <d  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 6px;\n  font-size: 11px;\n  color: var(--text-muted);\n}\n\n.mini-diff-box {\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 4px;\n  padding: 6px 8px;\n  font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Ubuntu Mono', monospace;\n  font-size: 11px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  max-height: 100px;\n  overflow: hidden;\n}\n\n.diff-line {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  padding: 1px 4px;\n  border-radius: 2px;\n}\n\n.diff-line.add {\n  background-color: var(--diff-add-bg);\n  color: var(--diff-add-fg);\n}\n\n.diff-line.del {\n  background-color: var(--diff-del-bg);\n  color: var(--diff-del-fg);\n}\n\n.diff-line.info {\n  color: var(--text-muted);\n  font-style: italic;\n}\n\n/* Timelapse Player */\n.timelapse-card {\n  gap: 12px;\n}\n\n.speed-selector {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 4px;\n  padding: 2px 4px;\n}\n\n.speed-label {\n  font-size: 11px;\n  color: var(--text-muted);\n  padding: 0 4px;\n}\n\n.btn-speed {\n  background: transparent;\n  border: none;\n  color: var(--text-muted);\n  font-size: 11px;\n  font-weight: 600;\n  padding: 2px 6px;\n  border-radius: 3px;\n  cursor: pointer;\n  transition: all 0.15s ease;\n}\n\n.btn-speed.active {\n  background-color: var(--accent-color);\n  color: #fff;\n}\n\n.btn-speed:hover:not(.active) {\n  background-color: var(--bg-card-hover);\n  color: var(--text-primary);\n}\n\n/* File Tabs Bar */\n.file-tabs-bar {\n  display: flex;\n  gap: 4px;\n  overflow-x: auto;\n  border-bottom: 1px solid var(--border-color);\n  padding-bottom: 4px;\n}\n\n.file-tab {\n  background-color: var(--bg-primary);\n  color: var(--text-muted);\n  border: 1px solid var(--border-color);\n  border-radius: 4px 4px 0 0;\n  padding: 4px 10px;\n  font-size: 12px;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  transition: all 0.15s ease;\n  white-space: nowrap;\n}\n\n.file-tab.active {\n  background-color: var(--bg-card);\n  color: var(--text-primary);\n  border-bottom-color: var(--bg-card);\n  font-weight: 500;\n}\n\n.file-tab:hover:not(.active) {\n  background-color: var(--bg-card-hover);\n  color: var(--text-primary);\n}\n\n/* Code Viewer & Editor */\n.code-viewer-container {\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n}\n\n.code-editor-header {\n  background-color: var(--bg-secondary);\n  border-bottom: 1px solid var(--border-color);\n  padding: 6px 12px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 11px;\n}\n\n.editor-file-path {\n  font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;\n  font-weight: 600;\n  color: var(--text-primary);\n}\n\n.editor-snapshot-meta {\n  color: var(--text-muted);\n}\n\n.code-editor-body {\n  font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Ubuntu Mono', monospace;\n  font-size: 12px;\n  line-height: 1.6;\n  max-height: 380px;\n  overflow-y: auto;\n  padding: 8px 0;\n  tab-size: 2;\n  position: relative;\n}\n\n.code-line {\n  display: flex;\n  padding: 0 8px;\n  min-height: 20px;\n}\n\n.code-line.active-line {\n  background-color: rgba(255, 255, 255, 0.04);\n}\n\n.line-number {\n  width: 40px;\n  text-align: right;\n  padding-right: 14px;\n  color: var(--text-muted);\n  user-select: none;\n  opacity: 0.6;\n  flex-shrink: 0;\n}\n\n.line-content {\n  flex: 1;\n  white-space: pre-wrap;\n  word-break: break-all;\n}\n\n/* Blinking Cursor & Selection */\n.editor-cursor {\n  display: inline-block;\n  width: 2px;\n  height: 14px;\n  background-color: var(--vscode-editorCursor-foreground, #007acc);\n  vertical-align: text-bottom;\n  margin: 0 1px;\n  animation: blink 1s step-end infinite;\n}\n\n@keyframes blink {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0; }\n}\n\n/* Like a real editor, the caret stays solid while text is being typed */\n.code-editor-body.is-typing .editor-cursor {\n  animation: none;\n}\n\n.typing-indicator {\n  color: var(--success-color);\n  margin-right: 8px;\n  animation: pulse 1.2s ease-in-out infinite;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .editor-cursor,\n  .typing-indicator {\n    animation: none;\n  }\n}\n\n.editor-selection {\n  background-color: var(--vscode-editor-selectionBackground, rgba(38, 79, 120, 0.7));\n  border-radius: 2px;\n  padding: 1px 0;\n}\n\n.empty-player-state {\n  padding: 32px;\n  text-align: center;\n  color: var(--text-muted);\n  font-size: 13px;\n}\n\n/* Timelapse Controls & Scrubber */\n.timelapse-controls {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  background-color: var(--bg-secondary);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  padding: 8px 12px;\n}\n\n.playback-button-group {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n}\n\n.btn-icon {\n  padding: 4px 8px;\n  font-size: 12px;\n}\n\n.btn-play {\n  min-width: 85px;\n  justify-content: center;\n}\n\n.slider-track-container {\n  flex: 1;\n  min-width: 120px;\n  position: relative;\n  display: flex;\n  align-items: center;\n}\n\n.timelapse-slider {\n  width: 100%;\n  height: 6px;\n  -webkit-appearance: none;\n  background-color: var(--bg-card);\n  border-radius: 3px;\n  outline: none;\n  cursor: pointer;\n}\n\n.timelapse-slider::-webkit-slider-thumb {\n  -webkit-appearance: none;\n  width: 14px;\n  height: 14px;\n  border-radius: 50%;\n  background-color: var(--vscode-button-foreground, #fff);\n  border: 2px solid var(--accent-color);\n  cursor: pointer;\n  box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);\n}\n\n.timeline-run-badge {\n  position: absolute;\n  top: -7px;\n  transform: translateX(-50%);\n  width: 16px;\n  height: 16px;\n  border-radius: 50%;\n  border: 1px solid #f erflow-y: auto;\n  margin: 0;\n  white-space: pre-wrap;\n  color: var(--text-primary);\n}\n\n/* Prism Syntax Highlighting Overrides */\n.token.comment, .token.prolog, .token.doctype, .token.cdata { color: #6a9955; }\n.token.punctuation { color: #d4d4d4; }\n.token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #b5cea8; }\n.token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #ce9178; }\n.timeline-framework-badge {\n  position: absolute;\n  top: -9px;\n  transform: translateX(-50%);\n  width: 18px;\n  height: 18px;\n  border-radius: 50%;\n  background-color: var(--bg-card);\n  border: 1px solid var(--border-color);\n  font-size: 10px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n  transition: transform 0.15s ease, border-color 0.15s ease;\n  z-index: 11;\n  box-shadow: 0 1px 4px rgba(0,0,0,0.3);\n}\n\n.timeline-framework-badge:hover {\n  transform: translateX(-50%) scale(1.3);\n  border-color: var(--accent-color);\n}\n\n/* AI Summary Card */\n.ai-summary-card {\n  gap: 16px;\n  border: 1px solid rgba(14, 99, 156, 0.4);\n}\n\n.ai-tabs-bar {\n  display: flex;\n  gap: 8px;\n  border-bottom: 1px solid var(--border-color);\n  padding-bottom: 8px;\n}\n\n.ai-tab {\n  background-color: var(--bg-primary);\n  color: var(--text-muted);\n  border: 1px solid var(--border-color);\n  border-radius: 4px;\n  padding: 6px 12px;\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  transition: all 0.15s ease;\n}\n\n.ai-tab.active {\n  background-color: var(--accent-color);\n  color: #fff;\n  border-color: var(--accent-color);\n}\n\n.ai-tab:hover:not(.active) {\n  background-color: var(--bg-card-hover);\n  color: var(--text-primary);\n}\n\n.ai-content-box {\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  padding: 14px;\n  display: flex;\n  fl er, var(--vscode-panel-border, #3c3c3c));\n  --accent-color: var(--vscode-button-background, #0e639c);\n  --accent-hover: var(--vscode-button-hoverBackground, #1177bb);\n  --success-color: var(--vscode-gitDecoration-addedResourceForeground, #4ec9b0);\n  --error-color: var(--vscode-errorForeground, #f14c4c);\n  --warning-color: var(--vscode-editorWarning-foreground, #cca700);\n  --badge-bg: var(--vscode-badge-background, #4d4d4d);\n  --badge-fg: var(--vscode-badge-foreground, #ffffff);\n  --diff-add-bg: var(--vscode-diffEditor-insertedTextBackground, rgba(46, 160, 67, 0.25));\n  --diff-add-fg: var(--vscode-gitDecoration-addedResourceForeground, #7ee787);\n  --diff-del-bg: var(--vscode-diffEditor-removedTextBackground, rgba(248, 81, 73, 0.25));\n  --diff-del-fg: var(--vscode-gitDecoration-deletedResourceForeground, #ffa198);\n}\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  padding: 0;\n  font-family: var(--vscode-font-family);\n  color: var(--text-primary);\n  background-color: var(--bg-primary);\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* Dashboard Container */\n.codelapse-container {\n  max-width: 1200px;\n  margin: 0 auto;\n  padding: 24px;\n  display: flex;\n  flex-direction: column;\n  gap: 24px;\n}\n\n/* Header */\n.dashboard-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 16px;\n  border-bottom: 1px solid var(--border-color);\n  padding-bottom: 16px;\n}\n\n.header-left {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n\n.header-title {\n  font-size: 20px;\n  font-weight: 600;\n  margin: 0;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.workspace-pill {\n  font-size: 12px;\n  padding: 2px 8px;\n  background-color: var(--bg-card);\n  border: 1px solid var(--border-color);\n  border-radius: 12px;\n  color: var(--text-muted);\n}\n\n.status-badge {\n  font-size: 11px;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.5px;\n  padding: 3px 8px;\n  border-radius: 4px;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.status-badge.recording {\n  background-color: rgba(235, 87, 87, 0.2);\n  color: #ff6b6b;\n  border: 1px solid rgba(235, 87, 87, 0.4);\n}\n\n.status-badge.paused {\n  background-color: rgba(204, 167, 0, 0.2);\n  color: var(--warning-color);\n  border: 1px solid rgba(204, 167, 0, 0.4);\n}\n\n.status-badge.idle {\n  background-color: var(--bg-card);\n  color: var(--text-muted);\n  border: 1px solid var(--border-color);\n}\n\n.pulse-dot {\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background-color: currentColor;\n  animation: pulse 1.8s infinite;\n}\n\n@keyframes pulse {\n  0% { opacity: 1; transform: scale(1); }\n  50% { opacity: 0.4; transform: scale(0.8); }\n  100% { opacity: 1; transform: scale(1); }\n}\n\n.header-actions {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.btn {\n  background-color: var(--accent-color);\n  color: var(--vscode-button-foreground, #fff);\n  border: none;\n  padding: 6px 14px;\n  font-size: 13px;\n  font-weight: 500;\n  border-radius: 4px;\n  cursor: pointer;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  transition: background-color 0.15s ease;\n}\n\n.btn:hover {\n  background-color: var(--accent-hover);\n}\n\n.btn-secondary {\n  background-color: var(--bg-card);\n  color: var(--text-primary);\n  border: 1px solid var(--border-color);\n}\n\n.btn-secondary:hover {\n  background-color: var(--bg-card-hover);\n}\n\n/* Metrics Row */\n.metrics-row {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n}\n\n.metric-card {\n  background-color: var(--bg-card);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  padding: 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  transition: transform 0.15s ease, border-color 0.15s ease;\n}\n\n.metric-card:hover {\n  border-color: var(--accent-color);\n  transform: translateY(-1px);\n}\n\n.metric-label {\n  font-size: 12px;\n  color: var(--text-muted);\n  font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: 0.5px;\n}\n\n.metric-value {\n  font-size: 24px;\n  font-weight: 700;\n  color: var(--text-primary);\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n}\n\n.metric-subtext {\n  font-size: 12px;\n  color: var(--text-muted);\n  margin-top: 2px;\n}\n\n.positive {\n  color: var(--success-color);\n}\n\n.negative {\n  color: var(--error-color);\n}\n\n/* Section Card */\n.section-card {\n  background-color: var(--bg-card);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  padding: 20px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n.section-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n\n.section-title {\n  font-size: 16px;\n  font-weight: 600;\n  margin: 0;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.section-subtitle {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n/* 24-Bucket Activity Chart */\n.chart-wrapper {\n  position: relative;\n  padding: 16px 0 8px 0;\n}\n\n.bars-container {\n  display: flex;\n  align-items: flex-end;\n  gap: 4px;\n  height: 140px;\n  padding-bottom: 24px;\n  border-bottom: 1px solid var(--border-color);\n  position: relative;\n}\n\n.bar-column {\n  flex: 1;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  justify-content: flex-end;\n  align-items: center;\n  position: relative;\n  cursor: pointer;\n}\n\n.bar-fill {\n  width: 100%;\n  min-height: 4px;\n  background-color: var(--accent-color);\n  border-radius: 3px 3px 0 0;\n  transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease;\n  position: relative;\n}\n\n.bar-column:hover .bar-fill {\n  background-color: var(--diff-add-fg);\n  filter: brightness(1.2);\n}\n\n.bar-column.active .bar-fill {\n  background-color: var(--diff-add-fg);\n  outline: 2px solid var(--accent-color);\n}\n\n.run-marker {\n  position: absolute;\n  top: -10px;\n  width: 7px;\n  height: 7px;\n  border-radius: 50%;\n}\n\n.run-marker.pass {\n  background-color: var(--success-color);\n  box-shadow: 0 0 6px rgba(78, 201, 176, 0.8);\n}\n\n.run-marker.fail {\n  background-color: var(--error-color);\n  box-shadow: 0 0 6px rgba(241, 76, 76, 0.8);\n}\n\n.timeline-axis {\n  display: flex;\n  justify-content: space-between;\n  margin-top: 6px;\n  font-size: 11px;\n  color: var(--text-muted);\n}\n\n/* Tooltip & Mini Diff */\n.activity-tooltip {\n  position: absolute;\n  bottom: calc(100% + 12px);\n  left: 50%;\n  transform: translateX(-50%);\n  background-color: var(--bg-secondary);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  padding: 12px;\n  width: 260px;\n  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);\n  z-index: 100;\n  pointer-events: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.tooltip-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  border-bottom: 1px solid var(--border-color);\n  padding-bottom: 6px;\n}\n\n.tooltip-title {\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--text-primary);\n}\n\n.tooltip-badge {\n  font-size: 10px;\n  background-color: var(--bg-card);\n  padding: 2px 6px;\n  border-radius: 4px;\n  color: var(--text-muted);\n}\n\n.tooltip-stats {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 6px;\n  font-size: 11px;\n  color: var(--text-muted);\n}\n\n.mini-diff-box {\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 4px;\n  padding: 6px 8px;\n  font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Ubuntu Mono', monospace;\n  font-size: 11px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  max-height: 100px;\n  overflow: hidden;\n}\n\n.diff-line {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  padding: 1px 4px;\n  border-radius: 2px;\n}\n\n.diff-line.add {\n  background-color: var(--diff-add-bg);\n  color: var(--diff-add-fg);\n}\n\n.diff-line.del {\n  background-color: var(--diff-del-bg);\n  color: var(--diff-del-fg);\n}\n\n.diff-line.info {\n  color: var(--text-muted);\n  font-style: italic;\n}\n\n/* Timelapse Player */\n.timelapse-card {\n  gap: 12px;\n}\n\n.speed-selector {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 4px;\n  padding: 2px 4px;\n}\n\n.speed-label {\n  font-size: 11px;\n  color: var(--text-muted);\n  padding: 0 4px;\n}\n\n.btn-speed {\n  background: transparent;\n  border: none;\n  color: var(--text-muted);\n  font-size: 11px;\n  font-weight: 600;\n  padding: 2px 6px;\n  border-radius: 3px;\n  cursor: pointer;\n  transition: all 0.15s ease;\n}\n\n.btn-speed.active {\n  background-color: var(--accent-color);\n  color: #fff;\n}\n\n.btn-speed:hover:not(.active) {\n  background-color: var(--bg-card-hover);\n  color: var(--text-primary);\n}\n\n/* File Tabs Bar */\n.file-tabs-bar {\n  display: flex;\n  gap: 4px;\n  overflow-x: auto;\n  border-bottom: 1px solid var(--border-color);\n  padding-bottom: 4px;\n}\n\n.file-tab {\n  background-color: var(--bg-primary);\n  color: var(--text-muted);\n  border: 1px solid var(--border-color);\n  border-radius: 4px 4px 0 0;\n  padding: 4px 10px;\n  font-size: 12px;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  transition: all 0.15s ease;\n  white-space: nowrap;\n}\n\n.file-tab.active {\n  background-color: var(--bg-card);\n  color: var(--text-primary);\n  border-bottom-color: var(--bg-card);\n  font-weight: 500;\n}\n\n.file-tab:hover:not(.active) {\n  background-color: var(--bg-card-hover);\n  color: var(--text-primary);\n}\n\n/* Code Viewer & Editor */\n.code-viewer-container {\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n}\n\n.code-editor-header {\n  background-color: var(--bg-secondary);\n  border-bottom: 1px solid var(--border-color);\n  padding: 6px 12px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 11px;\n}\n\n.editor-file-path {\n  font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;\n  font-weight: 600;\n  color: var(--text-primary);\n}\n\n.editor-snapshot-meta {\n  color: var(--text-muted);\n}\n\n.code-editor-body {\n  font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Ubuntu Mono', monospace;\n  font-size: 12px;\n  line-height: 1.6;\n  max-height: 380px;\n  overflow-y: auto;\n  padding: 8px 0;\n  tab-size: 2;\n  position: relative;\n}\n\n.code-line {\n  display: flex;\n  padding: 0 8px;\n  min-height: 20px;\n}\n\n.code-line.active-line {\n  background-color: rgba(255, 255, 255, 0.04);\n}\n\n.line-number {\n  width: 40px;\n  text-align: right;\n  padding-right: 14px;\n  color: var(--text-muted);\n  user-select: none;\n  opacity: 0.6;\n  flex-shrink: 0;\n}\n\n.line-content {\n  flex: 1;\n  white-space: pre-wrap;\n  word-break: break-all;\n}\n\n/* Blinking Cursor & Selection */\n.editor-cursor {\n  display: inline-block;\n  width: 2px;\n  height: 14px;\n  background-color: var(--vscode-editorCursor-foreground, #007acc);\n  vertical-align: text-bottom;\n  margin: 0 1px;\n  animation: blink 1s step-end infinite;\n}\n\n@keyframes blink {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0; }\n}\n\n/* Like a real editor, the caret stays solid while text is being typed */\n.code-editor-body.is-typing .editor-cursor {\n  animation: none;\n}\n\n.typing-indicator {\n  color: var(--success-color);\n  margin-right: 8px;\n  animation: pulse 1.2s ease-in-out infinite;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .editor-cursor,\n  .typing-indicator {\n    animation: none;\n  }\n}\n\n.editor-selection {\n  background-color: var(--vscode-editor-selectionBackground, rgba(38, 79, 120, 0.7));\n  border-radius: 2px;\n  padding: 1px 0;\n}\n\n.empty-player-state {\n  padding: 32px;\n  text-align: center;\n  color: var(--text-muted);\n  font-size: 13px;\n}\n\n/* Timelapse Controls & Scrubber */\n.timelapse-controls {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  background-color: var(--bg-secondary);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  padding: 8px 12px;\n}\n\n.playback-button-group {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n}\n\n.btn-icon {\n  padding: 4px 8px;\n  font-size: 12px;\n}\n\n.btn-play {\n  min-width: 85px;\n  justify-content: center;\n}\n\n.slider-track-container {\n  flex: 1;\n  min-width: 120px;\n  position: relative;\n  display: flex;\n  align-items: center;\n}\n\n.timelapse-slider {\n  width: 100%;\n  height: 6px;\n  -webkit-appearance: none;\n  background-color: var(--bg-card);\n  border-radius: 3px;\n  outline: none;\n  cursor: pointer;\n}\n\n.timelapse-slider::-webkit-slider-thumb {\n  -webkit-appearance: none;\n  width: 14px;\n  height: 14px;\n  border-radius: 50%;\n  background-color: var(--vscode-button-foreground, #fff);\n  border: 2px solid var(--accent-color);\n  cursor: pointer;\n  box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);\n}\n\n.timeline-run-badge {\n  position: absolute;\n  top: -7px;\n  transform: translateX(-50%);\n  width: 16px;\n  height: 16px;\n  border-radius: 50%;\n  border: 1px solid #fff;\n  font-size: 9px;\n  font-weight: 700;\n  color: #fff;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n  transition: transform 0.15s ease;\n  z-index: 10;\n}\n\n.timeline-run-badge:hover {\n  transform: translateX(-50%) scale(1.3);\n}\n\n.timeline-run-badge.pass {\n  background-color: var(--success-color);\n}\n\n.timeline-run-badge.fail {\n  background-color: var(--error-color);\n}\n\n.time-display {\n  font-family: 'SF Mono', Monaco, monospace;\n  font-size: 11px;\n  color: var(--text-muted);\n  white-space: nowrap;\n}\n\n/* Narrow panels: give the scrubber its own full-width row instead of letting\n   the buttons and time display squeeze it to nothing. */\n@media (max-width: 560px) {\n  .timelapse-controls {\n    flex-wrap: wrap;\n  }\n\n  .time-display {\n    margin-left: auto;\n  }\n\n  .slider-track-container {\n    order: 3;\n    flex-basis: 100%;\n    min-height: 28px;\n  }\n}\n\n/* Run Details Banner */\n.run-details-banner {\n  background-color: var(--bg-primary);\n  border: 1px solid var(--border-color);\n  border-radius: 6px;\n  padding: 10px 12px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n\n.run-details-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n\n.run-status-tag {\n  font-size: 11px;\n  font-weight: 600;\n  padding: 2px 6px;\n  border-radius: 3px;\n}\n\n.run-command-text {\n  font-size: 12px;\n  font-family: monospace;\n  color: var(--text-muted);\n  flex: 1;\n  margin: 0 10px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.btn-close-banner {\n  background: transparent;\n  border: none;\n  color: var(--text-muted);\n  cursor: pointer;\n  font-size: 12px;\n}\n\n.btn-close-banner:hover {\n  color: var(--text-primary);\n}\n\n.run-output-box {\n  background-color: var(--bg-secondary);\n  border: 1px solid var(--border-color);\n  border-radius: 4px;\n  padding: 8px;\n  font-size: 11px;\n  max-height: 120px;\n  overflow-y: auto;\n  margin: 0;\n  white-space: pre-wrap;\n  color: var(--text-primary);\n}\n\n/* Prism Syntax Highlighting Overrides */\n.token.comment, .token.prolog, .token.doctype, .token.cdata { color: #6a9955; }\n.token.punctuation { color: #d4d4d4; }\n.token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #b5cea8; }\n.token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #ce9178; }\n.timeline-framework-badge {\n  position: absolute;\n  top: -9px;\n  transform: translateX(-50%);\n  width: 18px;\n  height: 18px;\n  border-radius: 50%;\n  backgro

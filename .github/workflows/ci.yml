name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run compile
      - name: Build and smoke-test the submission site
        run: npm run web:build && npm run web:smoke
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
